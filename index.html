    function App() {
      const [images, setImages] = useState([]);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [applyToAll, setApplyToAll] = useState(true);
      const [activeTab, setActiveTab] = useState('background');
      const [bgCategory, setBgCategory] = useState('manga');
      const [searchQuery, setSearchQuery] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [processingStatus, setProcessingStatus] = useState('');
      const [progress, setProgress] = useState({ current: 0, total: 0 });
      const [toasts, setToasts] = useState([]);

      const [outputQuality, setOutputQuality] = useState('4k');
      const [comparingItem, setComparingItem] = useState(null);
      const [compareSlider, setCompareSlider] = useState(50);
      const [isCervexOpen, setIsCervexOpen] = useState(false);

      const segmenterRef = useRef(null);

      useEffect(() => {
        try {
          if (window.SelfieSegmentation) {
            const segmenter = new window.SelfieSegmentation({
              locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`,
            });
            segmenter.setOptions({ modelSelection: 1 });
            segmenterRef.current = segmenter;
          }
        } catch (e) {
          console.warn("MediaPipe init:", e);
        }
      }, []);

      const [watermark, setWatermark] = useState({
        enabled: false,
        text: '© PIXELBATCH AI',
        color: '#ffffff',
        opacity: 85,
      });

      const addToast = (title, message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, title, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };

      const generateAutoCutout = async (imgUrl) => {
        return new Promise((resolve) => {
          const img = new Image();
          if (imgUrl.startsWith('http')) {
            img.crossOrigin = 'anonymous';
          }
          img.src = imgUrl;

          img.onload = async () => {
            try {
              const w = img.naturalWidth || 1200;
              const h = img.naturalHeight || 1200;

              const subjectCanvas = document.createElement('canvas');
              subjectCanvas.width = w;
              subjectCanvas.height = h;
              const sctx = subjectCanvas.getContext('2d', { willReadFrequently: true });
              sctx.drawImage(img, 0, 0, w, h);

              let maskFound = false;

              if (segmenterRef.current) {
                try {
                  await Promise.race([
                    new Promise((res) => {
                      const tempCanvas = document.createElement('canvas');
                      tempCanvas.width = w;
                      tempCanvas.height = h;
                      const tctx = tempCanvas.getContext('2d');
                      tctx.drawImage(img, 0, 0, w, h);

                      segmenterRef.current.onResults((results) => {
                        if (results.segmentationMask) {
                          sctx.save();
                          sctx.globalCompositeOperation = 'destination-in';
                          sctx.drawImage(results.segmentationMask, 0, 0, w, h);
                          sctx.restore();
                          maskFound = true;
                        }
                        res();
                      });
                      segmenterRef.current.send({ image: tempCanvas });
                    }),
                    new Promise((res) => setTimeout(res, 1200))
                  ]);
                } catch (err) {
                  maskFound = false;
                }
              }

              resolve({
                cutoutUrl: subjectCanvas.toDataURL('image/png'),
                w: w,
                h: h
              });
            } catch (err) {
              console.warn("Cutout error:", err);
              resolve({ cutoutUrl: imgUrl, w: 1200, h: 1200 });
            }
          };
          img.onerror = () => resolve({ cutoutUrl: imgUrl, w: 1200, h: 1200 });
        });
      };

      useEffect(() => {
        const initial = DEMO_LIBRARY.map(d => ({
          id: d.id,
          name: d.name,
          originalUrl: d.url,
          cutoutUrl: d.url,
          currentUrl: d.url,
          isCutout: true,
          isModified: false,
        }));
        setImages(initial);
        setSelectedIds(new Set(initial.map(img => img.id)));
      }, []);

      const handleFiles = async (files) => {
        if (!files || files.length === 0) return;
        const count = files.length;
        
        setIsProcessing(true);
        setProcessingStatus('Détourage automatique IA en cours...');
        setProgress({ current: 0, total: count });

        const rawList = [];
        Array.from(files).forEach((file) => {
          const url = URL.createObjectURL(file);
          const id = 'img_' + Math.random().toString(36).substring(2, 9);
          rawList.push({
            id: id,
            name: file.name,
            originalUrl: url,
            cutoutUrl: url,
            currentUrl: url,
            isCutout: false,
            isModified: false,
          });
        });

        const processedList = [];
        for (let i = 0; i < rawList.length; i++) {
          const item = rawList[i];
          const result = await generateAutoCutout(item.originalUrl);
          
          processedList.push({
            ...item,
            cutoutUrl: result.cutoutUrl,
            currentUrl: result.cutoutUrl,
            isCutout: true,
            isModified: true,
          });

          setProgress({ current: i + 1, total: count });
          if ((i + 1) % 2 === 0) {
            await new Promise(r => setTimeout(r, 10));
          }
        }

        setImages(prev => {
          const nextList = [...prev, ...processedList];
          setSelectedIds(new Set(nextList.map(m => m.id)));
          return nextList;
        });

        setIsProcessing(false);
        addToast(
          'Détourage 100% Réussi !',
          `Le fond de vos ${count} photos a été entièrement supprimé. Choisissez maintenant le fond à appliquer en 1 clic !`,
          'success'
        );
      };

      const toggleSelect = (id) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };
      const selectAll = () => setSelectedIds(new Set(images.map(img => img.id)));
      const revertSelected = () => {
        setImages(prev => prev.map(img => {
          if (applyToAll || selectedIds.has(img.id)) {
            return { ...img, currentUrl: img.cutoutUrl, isModified: true };
          }
          return img;
        }));
        addToast('Fond Retiré', 'Retour au sujet détouré transparent', 'info');
      };
      const deleteSelected = () => {
        setImages(prev => prev.filter(img => !selectedIds.has(img.id)));
        setSelectedIds(new Set());
        addToast('Supprimé', 'Photos supprimées', 'info');
      };

      const compositeBackground = async (item, bgConfig) => {
        return new Promise((resolve) => {
          const subjectImg = new Image();
          if (item.cutoutUrl.startsWith('http')) {
            subjectImg.crossOrigin = 'anonymous';
          }
          subjectImg.src = item.cutoutUrl;

          subjectImg.onload = async () => {
            try {
              let w = subjectImg.naturalWidth || 1200;
              let h = subjectImg.naturalHeight || 1200;

              if (outputQuality === '4k') {
                const targetW = 3840;
                const scale = targetW / w;
                w = targetW;
                h = Math.round(h * scale);
              } else if (outputQuality === '2k') {
                const targetW = 2048;
                const scale = targetW / w;
                w = targetW;
                h = Math.round(h * scale);
              } else if (outputQuality === '1080p') {
                const targetW = 1920;
                const scale = targetW / w;
                w = targetW;
                h = Math.round(h * scale);
              }

              const finalCanvas = document.createElement('canvas');
              finalCanvas.width = w;
              finalCanvas.height = h;
              const fctx = finalCanvas.getContext('2d');
              fctx.imageSmoothingEnabled = true;
              fctx.imageSmoothingQuality = 'high';

              if (bgConfig.value !== 'transparent') {
                if (bgConfig.type === 'solid') {
                  fctx.fillStyle = bgConfig.value;
                  fctx.fillRect(0, 0, w, h);
                } else if (bgConfig.type === 'gradient' && bgConfig.colors) {
                  const grad = fctx.createLinearGradient(0, 0, w, h);
                  grad.addColorStop(0, bgConfig.colors[0]);
                  grad.addColorStop(0.5, bgConfig.colors[1]);
                  grad.addColorStop(1, bgConfig.colors[2]);
                  fctx.fillStyle = grad;
                  fctx.fillRect(0, 0, w, h);
                } else if (bgConfig.url) {
                  try {
                    const bgImg = new Image();
                    bgImg.crossOrigin = 'anonymous';
                    await new Promise((res, rej) => {
                      bgImg.onload = res;
                      bgImg.onerror = rej;
                      bgImg.src = bgConfig.url;
                    });
                    fctx.drawImage(bgImg, 0, 0, w, h);
                  } catch (e) {
                    fctx.fillStyle = '#4f46e5';
                    fctx.fillRect(0, 0, w, h);
                  }
                }
              }

              fctx.drawImage(subjectImg, 0, 0, w, h);

              if (watermark.enabled && watermark.text) {
                fctx.save();
                fctx.globalAlpha = watermark.opacity / 100;
                const fontSize = Math.max(16, Math.round(w * 0.03));
                fctx.font = `700 ${fontSize}px "Plus Jakarta Sans", sans-serif`;
                const metrics = fctx.measureText(watermark.text);
                const wx = w - metrics.width - 50;
                const wy = h - 50;

                fctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                fctx.beginPath();
                fctx.roundRect(wx - 16, wy - fontSize - 8, metrics.width + 32, fontSize + 20, 12);
                fctx.fill();

                fctx.fillStyle = watermark.color;
                fctx.fillText(watermark.text, wx, wy);
                fctx.restore();
              }

              resolve({
                ...item,
                currentUrl: finalCanvas.toDataURL('image/png'),
                isModified: true,
                outputResolution: `${w} × ${h} px`,
              });
            } catch (err) {
              console.warn("Composite error:", err);
              resolve(item);
            }
          };
          subjectImg.onerror = () => resolve(item);
        });

              img.src = item.currentUrl;
              await new Promise(res => { img.onload = res; });
              const w = img.naturalWidth;
              const h = img.naturalHeight;
              let tw = w;
              let th = h;
              if (ratio === '1:1') { tw = Math.min(w, h); th = tw; }
              else if (ratio === '16:9') { th = Math.round(w * (9 / 16)); }
              else if (ratio === '9:16') { tw = Math.round(h * (9 / 16)); }

              const canvas = document.createElement('canvas');
              canvas.width = tw;
              canvas.height = th;
              const ctx = canvas.getContext('2d');
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, (w - tw) / 2, (h - th) / 2, tw, th, 0, 0, tw, th);
              updated[i] = { ...item, currentUrl: canvas.toDataURL('image/png'), isModified: true };
            }
            setProgress({ current: i + 1, total: images.length });

                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-pink-400 font-bold flex items-center gap-1">
                        ✨ 40 Véritables Fresques & Peintures de Héros, Dragons & Guerriers Mangas :
                      </span>
                      <div className="grid grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-1">
                        {filteredManga.map(m => (
                          <button
                            key={m.id}
                            onClick={() => applyBackground(m)}
                            className="group relative h-24 rounded-2xl overflow-hidden border border-pink-500/40 hover:border-pink-400 hover:scale-[1.02] transition-all text-left flex flex-col justify-end p-2 bg-slate-900 shadow-md"
                          >
                            <img src={m.thumb || m.url} alt={m.label} className="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition-transform duration-300" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
                            <span className="relative z-10 text-[11px] font-bold text-white drop-shadow truncate">
                              {m.label}
                            </span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 2. POP ART DE MAÎTRES (40 CHOIX SOPHISTIQUÉS) */}
                  {bgCategory === 'popart' && (
                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-amber-300 font-bold">
                        👉 40 Motifs Pop Art Iconiques (Takashi Murakami, KAWS, Warhol, Lichtenstein, Haring) :
                      </span>
                      <div className="grid grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-1">
                        {filteredPopArt.map(p => (
                          <button
                            key={p.id}
                            onClick={() => applyBackground(p)}
                            className="group relative h-24 rounded-2xl overflow-hidden border border-amber-500/40 hover:border-amber-400 hover:scale-[1.02] transition-all text-left flex flex-col justify-end p-2 bg-slate-900 shadow-md"
                          >
                            <img src={p.url} alt={p.label} className="absolute inset-0 w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent"></div>
                            <span className="relative z-10 text-[11px] font-bold text-white drop-shadow truncate">
                              {p.label}
                            </span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 3. REAL 4K DESERTS & NATURE */}
                  {bgCategory === 'nature' && (
                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 40 Vrais Déserts Somptueux & Paysages Nature 4K :
                      </span>
                      <div className="grid grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-1">
                        {filteredNature.map(n => (
                          <button
                            key={n.id}
                            onClick={() => applyBackground(n)}
                            className="group relative h-24 rounded-2xl overflow-hidden border border-amber-500/40 hover:border-amber-400 hover:scale-[1.02] transition-all text-left flex flex-col justify-end p-2 bg-slate-900 shadow-md"
                          >
                            <img src={n.thumb || n.url} alt={n.label} className="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition-transform duration-300" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
                            <span className="relative z-10 text-[10px] font-bold text-white drop-shadow truncate">
                              {n.label}
                            </span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 4. REAL STUDIOS & LUXURY */}
                  {bgCategory === 'studios' && (
                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 40 Véritables Studios Photo Pro & Intérieurs Luxe 4K :
                      </span>
                      <div className="grid grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-1">
                        {filteredStudios.map(s => (
                          <button
                            key={s.id}
                            onClick={() => applyBackground(s)}
                            className="group relative h-24 rounded-2xl overflow-hidden border border-slate-700 hover:border-indigo-500 hover:scale-[1.02] transition-all text-left flex flex-col justify-end p-2 bg-slate-900 shadow-md"
                          >
                            <img src={s.thumb || s.url} alt={s.label} className="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition-transform duration-300" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
                            <span className="relative z-10 text-[10px] font-bold text-white drop-shadow truncate">
                              {s.label}
                            </span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 5. REAL CITIES & SKYLINES */}
                  {bgCategory === 'cities' && (
                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 40 Véritables Skylines & Villes du Monde 4K :
                      </span>
                      <div className="grid grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-1">
                        {filteredCities.map(c => (
                          <button
                            key={c.id}
                            onClick={() => applyBackground(c)}
                            className="group relative h-24 rounded-2xl overflow-hidden border border-slate-700 hover:border-indigo-500 hover:scale-[1.02] transition-all text-left flex flex-col justify-end p-2 bg-slate-900 shadow-md"
                          >
                            <img src={c.thumb || c.url} alt={c.label} className="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition-transform duration-300" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
                            <span className="relative z-10 text-[10px] font-bold text-white drop-shadow truncate">
                              {c.label}
                            </span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 6. GRADIENTS */}
                  {bgCategory === 'gradients' && (
                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 40 Dégradés Modernes & Mesh Studio :
                      </span>
                      <div className="grid grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-1">
                        {filteredGradients.map(grad => (
                          <button
                            key={grad.id}
                            onClick={() => applyBackground({ type: 'gradient', colors: grad.colors, value: grad.id })}
                            style={{ background: grad.css }}
                            className="h-14 rounded-xl border border-slate-700 hover:border-white transition-all hover:scale-[1.02] flex items-end p-2 shadow-md"
                          >
                            <span className="text-[11px] font-bold text-white drop-shadow truncate">{grad.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 7. SOLID COLORS */}
                  {bgCategory === 'solids' && (
                    <div className="flex flex-col gap-3">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 40 Couleurs Studio & Pastels :
                      </span>
                      <div className="grid grid-cols-4 gap-2 max-h-80 overflow-y-auto pr-1">
                        {filteredSolids.map(color => (
                          <button
                            key={color.id}
                            onClick={() => applyBackground({ type: 'solid', value: color.value })}
                            className={`h-12 rounded-xl border transition-all hover:scale-105 flex flex-col items-center justify-center ${color.class} border-slate-700 shadow-sm`}
                            title={color.label}
                          >
                            <span className="text-[9px] font-bold px-1 rounded bg-black/40 text-white truncate max-w-[70px]">
                              {color.label.split(' ')[0]}
                            </span>
                          </button>
                        ))}
                      </div>

                      <div className="flex items-center gap-2 p-2.5 rounded-xl bg-slate-950 border border-slate-800">
                        <span className="text-xs text-slate-400">Couleur personnalisée :</span>
                        <input
                          type="color"
                          defaultValue="#6366f1"
                          onChange={(e) => applyBackground({ type: 'solid', value: e.target.value })}
                          className="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0"
                        />
                        <span className="text-xs font-mono text-indigo-400">Choisir teinte exacte</span>
                      </div>
                    </div>
                  )}

                  {/* Custom Background Upload */}
                  <div className="pt-2 border-t border-slate-800">
                    <label className="w-full py-2.5 px-3 rounded-xl border border-dashed border-slate-700 hover:border-pink-500 bg-slate-950/40 flex items-center justify-center gap-2 text-xs font-semibold text-slate-300 cursor-pointer transition-all">
                      <Icon name="image" className="w-4 h-4 text-pink-400" />
                      <span>Importer un fond personnalisé (depuis PC)</span>
                      <input type="file" accept="image/*" className="hidden" onChange={handleCustomBg} />
                    </label>
                  </div>

                </div>
              )}

              {/* TAB 2: CROP */}
              {activeTab === 'crop' && (
                <div className="flex flex-col gap-4">
                  <span className="text-xs font-bold text-slate-300">Ratios Prédéfinis en 1 Clic</span>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { id: '1:1', label: '1:1 Carré' },
                      { id: '16:9', label: '16:9 YouTube' },
                      { id: '9:16', label: '9:16 Story' },
                    ].map(r => (
                      <button
                        key={r.id}
                        onClick={() => applyCrop(r.id)}
                        className="py-3 px-2 rounded-xl bg-slate-950 hover:bg-pink-600 border border-slate-800 hover:border-pink-500 text-xs font-bold transition-all text-center"
                      >
                        {r.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: RESIZE */}
              {activeTab === 'resize' && (
                <div className="flex flex-col gap-4">
                  <span className="text-xs font-bold text-slate-300">Préréglages Sociaux Ultra-HD</span>
                  <div className="grid grid-cols-2 gap-2">
                    {[
                      { label: 'Instagram Carré', w: 1080, h: 1080 },
                      { label: 'Story / TikTok', w: 1080, h: 1920 },
                      { label: 'YouTube Miniature', w: 1920, h: 1080 },
                      { label: 'E-Commerce 4K', w: 3840, h: 3840 },
                    ].map(p => (
                      <button
                        key={p.label}
                        onClick={() => applyResize(p.w, p.h)}
                        className="p-3 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-pink-500 text-left transition-all"
                      >
                        <p className="text-xs font-bold text-slate-200">{p.label}</p>
                        <p className="text-[10px] font-mono text-amber-400">{p.w} × {p.h} px</p>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 4: WATERMARK */}
              {activeTab === 'watermark' && (
                <div className="flex flex-col gap-4">
                  <div className="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <span className="text-xs font-bold text-slate-200">Activer le Filigrane</span>
                    <input
                      type="checkbox"
                      checked={watermark.enabled}
                      onChange={(e) => setWatermark(prev => ({ ...prev, enabled: e.target.checked }))}
                      className="w-4 h-4 accent-pink-600 cursor-pointer"
                    />
                  </div>

                  <div>
                    <span className="text-[11px] text-slate-400 block mb-1">Texte du Filigrane</span>
                    <input
                      type="text"
                      value={watermark.text}
                      onChange={(e) => setWatermark(prev => ({ ...prev, text: e.target.value }))}
                      className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white"
                    />
                  </div>
                </div>
              )}

            </aside>
          </div>

          {/* BEFORE / AFTER MODAL */}
          {comparingItem && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="relative w-full max-w-3xl bg-slate-900 rounded-3xl border border-slate-800 p-6 flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white">Comparaison Avant / Après Ultra-HD</h3>
                  <button onClick={() => setComparingItem(null)} className="text-slate-400 hover:text-white">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="relative w-full h-[400px] bg-checkerboard flex items-center justify-center overflow-hidden rounded-2xl">
                  <img src={comparingItem.originalUrl} alt="Original" className="absolute inset-0 w-full h-full object-contain" />
                  <div style={{ clipPath: `inset(0 0 0 ${compareSlider}%)` }} className="absolute inset-0 w-full h-full">
                    <img src={comparingItem.currentUrl} alt="Modifié" className="w-full h-full object-contain" />
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="100"
                    value={compareSlider}
                    onChange={(e) => setCompareSlider(parseInt(e.target.value))}
                    className="absolute inset-0 opacity-0 cursor-ew-resize z-20 w-full h-full"
                  />
                  <div style={{ left: `${compareSlider}%` }} className="absolute top-0 bottom-0 w-1 bg-white pointer-events-none" />
                </div>
              </div>
            </div>
          )}

          {/* CERVEX MODAL */}
          {isCervexOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="relative w-full max-w-lg bg-slate-900 rounded-3xl border border-slate-800 p-6 flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Icon name="cpu" className="w-5 h-5 text-cervex-400" />
                    <span>Hub de Connexion Cervex</span>
                  </h3>
                  <button onClick={() => setIsCervexOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex flex-col gap-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Clé API Cervex</label>
                    <input type="password" value="crvx_live_9a87bf44d8e9" className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 font-mono" readOnly />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Projet ID</label>
                    <input type="text" value="project-ai-prod" className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 font-mono" readOnly />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                  <button
                    onClick={() => {
                      addToast('Cervex Sync', 'Synchronisation Cloud réussie (200 OK)', 'success');
                      setIsCervexOpen(false);
                    }}
                    className="px-4 py-2 rounded-xl bg-cervex-600 hover:bg-cervex-500 text-white font-bold text-xs"
                  >
                    Tester la synchronisation
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* REAL-TIME PROGRESS OVERLAY */}
          {isProcessing && (
            <div className="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 flex flex-col items-center gap-4 max-w-sm w-full shadow-2xl">
                <div className="w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
                <div className="text-center w-full">
                  <h3 className="text-sm font-bold text-white mb-1">{processingStatus}</h3>
                  <p className="text-xs text-slate-400 mb-3">
                    Photo {progress.current} sur {progress.total}
                  </p>
                  <div className="w-full h-2 rounded-full bg-slate-800 overflow-hidden border border-slate-700">
                    <div
                      className="h-full bg-gradient-to-r from-pink-500 via-purple-500 to-amber-500 transition-all duration-150"
                      style={{ width: `${(progress.current / Math.max(1, progress.total)) * 100}%` }}
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TOASTS */}
          <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(toast => (
              <div key={toast.id} className="pointer-events-auto px-4 py-3 rounded-2xl bg-slate-900 border border-slate-700 shadow-2xl text-xs text-white">
                <span className="font-bold">{toast.title}</span> : <span className="text-slate-400">{toast.message}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
