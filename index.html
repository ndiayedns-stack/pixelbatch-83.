    // --- Main Application ---
    function App() {
      const [images, setImages] = useState([]);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [activeTab, setActiveTab] = useState('background');
      const [bgCategory, setBgCategory] = useState('cartoons'); // 'cartoons' | 'solids' | 'gradients' | 'studios' | 'nature' | 'cities'
      const [searchQuery, setSearchQuery] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [processingMsg, setProcessingMsg] = useState('');
      const [toasts, setToasts] = useState([]);

      // Before/After Modal
      const [comparingItem, setComparingItem] = useState(null);
      const [compareSlider, setCompareSlider] = useState(50);

      // Cervex Modal
      const [isCervexOpen, setIsCervexOpen] = useState(false);

      // Auto cutout & tolerance
      const [autoCutout, setAutoCutout] = useState(true);
      const [tolerance, setTolerance] = useState(28);

      // Watermark
      const [watermark, setWatermark] = useState({
        enabled: false,
        text: '© PIXELBATCH AI',
        color: '#ffffff',
        opacity: 85,
      });

      const addToast = (title, message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, title, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };

      // Load initial 6 demo images
      useEffect(() => {
        const initial = DEMO_LIBRARY.slice(0, 6).map(d => ({
          id: d.id,
          name: d.name,
          originalUrl: d.url,
          currentUrl: d.url,
          width: 1200,
          height: 1200,
          isModified: false,
        }));
        setImages(initial);
        setSelectedIds(new Set(initial.map(img => img.id)));
      }, []);

      // Upload Handler
      const handleFiles = (files) => {
        if (!files || files.length === 0) return;
        const newIds = new Set(selectedIds);

        Array.from(files).forEach((file) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const url = e.target.result;
            const img = new Image();
            img.onload = () => {
              const id = 'img_' + Math.random().toString(36).substring(2, 9);
              newIds.add(id);
              setImages(prev => [
                ...prev,
                {
                  id,
                  name: file.name,
                  originalUrl: url,
                  currentUrl: url,
                  width: img.naturalWidth || 1200,
                  height: img.naturalHeight || 1200,
                  isModified: false,
                }
              ]);
              setSelectedIds(new Set(newIds));
            };
            img.src = url;
          };
          reader.readAsDataURL(file);
        });

        addToast('Photos Importées', `${files.length} image(s) ajoutée(s). Prêtes pour le changement de fond !`, 'success');
      };

      // Select / Deselect
      const toggleSelect = (id) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };
      const selectAll = () => setSelectedIds(new Set(images.map(img => img.id)));
      const deselectAll = () => setSelectedIds(new Set());
      const revertSelected = () => {
        setImages(prev => prev.map(img => {
          if (selectedIds.has(img.id)) {
            return { ...img, currentUrl: img.originalUrl, isModified: false };
          }
          return img;
        }));
        addToast('Restauré', 'Retour aux photos d’origine sans modification', 'info');
      };
      const deleteSelected = () => {
        setImages(prev => prev.filter(img => !selectedIds.has(img.id)));
        setSelectedIds(new Set());
        addToast('Supprimé', 'Images sélectionnées supprimées', 'info');
      };

      // =========================================================================
      // --- ULTRA CRISP HD CANVAS PROCESSOR : 100% QUALITY SUBJECT PRESERVED ---
      // =========================================================================
      const processSingleImage = async (item, bgConfig) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.src = item.originalUrl; // Process from crisp original

          img.onload = async () => {
            try {
              const w = img.naturalWidth || item.width || 1200;
              const h = img.naturalHeight || item.height || 1200;

              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d', { willReadFrequently: true });

              // 1. Paint Selected Background
              if (bgConfig.value !== 'transparent') {
                if (bgConfig.type === 'solid') {
                  ctx.fillStyle = bgConfig.value;
                  ctx.fillRect(0, 0, w, h);
                } else if (bgConfig.type === 'gradient' && bgConfig.colors) {
                  const grad = ctx.createLinearGradient(0, 0, w, h);
                  grad.addColorStop(0, bgConfig.colors[0]);
                  grad.addColorStop(0.5, bgConfig.colors[1]);
                  grad.addColorStop(1, bgConfig.colors[2]);
                  ctx.fillStyle = grad;
                  ctx.fillRect(0, 0, w, h);
                } else if (bgConfig.type === 'image' && bgConfig.url) {
                  try {
                    const bgImg = new Image();
                    bgImg.crossOrigin = 'anonymous';
                    await new Promise((res, rej) => {
                      bgImg.onload = res;
                      bgImg.onerror = rej;
                      bgImg.src = bgConfig.url;
                    });
                    ctx.drawImage(bgImg, 0, 0, w, h);
                  } catch (e) {
                    console.warn('Erreur fond image:', e);
                  }
                }
              }

              // 2. High-Precision Subject Extraction (Intact Subject, Dissolved Background)
              const subCanvas = document.createElement('canvas');
              subCanvas.width = w;
              subCanvas.height = h;
              const sctx = subCanvas.getContext('2d', { willReadFrequently: true });
              sctx.drawImage(img, 0, 0, w, h);

              if (autoCutout) {
                const imgData = sctx.getImageData(0, 0, w, h);
                const data = imgData.data;

                const samples = [
                  [data[0], data[1], data[2]],
                  [data[(w - 1) * 4], data[(w - 1) * 4 + 1], data[(w - 1) * 4 + 2]],
                  [data[(h - 1) * w * 4], data[(h - 1) * w * 4 + 1], data[(h - 1) * w * 4 + 2]],
                  [data[((h * w) - 1) * 4], data[((h * w) - 1) * 4 + 1], data[((h * w) - 1) * 4 + 2]],
                ];

                const bgR = Math.round(samples.reduce((a, s) => a + s[0], 0) / 4);
                const bgG = Math.round(samples.reduce((a, s) => a + s[1], 0) / 4);
                const bgB = Math.round(samples.reduce((a, s) => a + s[2], 0) / 4);

                const limit = tolerance * 2.8;

                for (let i = 0; i < data.length; i += 4) {
                  const r = data[i];
                  const g = data[i + 1];
                  const b = data[i + 2];

                  const dist = Math.sqrt(
                    Math.pow(r - bgR, 2) +
                    Math.pow(g - bgG, 2) +
                    Math.pow(b - bgB, 2)
                  );

                  if (dist < limit || (r > 245 && g > 245 && b > 245 && bgR > 230)) {
                    const alpha = Math.max(0, (dist / limit) - 0.25);
                    data[i + 3] = Math.round(data[i + 3] * alpha);
                  }
                }
                sctx.putImageData(imgData, 0, 0);
              }

              ctx.drawImage(subCanvas, 0, 0);

              // 3. Watermark
              if (watermark.enabled && watermark.text) {
                ctx.save();
                ctx.globalAlpha = watermark.opacity / 100;
                const fontSize = Math.max(16, Math.round(w * 0.035));
                ctx.font = `700 ${fontSize}px "Plus Jakarta Sans", sans-serif`;
                const metrics = ctx.measureText(watermark.text);
                const wx = w - metrics.width - 40;
                const wy = h - 40;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.beginPath();
                ctx.roundRect(wx - 14, wy - fontSize - 6, metrics.width + 28, fontSize + 18, 10);
                ctx.fill();

                ctx.fillStyle = watermark.color;
                ctx.fillText(watermark.text, wx, wy);
                ctx.restore();
              }

              resolve({
                ...item,
                currentUrl: canvas.toDataURL('image/png'),
                isModified: true,
              });
            } catch (err) {
              reject(err);
            }
          };
          img.onerror = reject;
        });

        if (images.length === 0) {

          return;
        }

        const targets = selectedIds.size > 0 ? selectedIds : new Set(images.map(img => img.id));
        if (selectedIds.size === 0) setSelectedIds(new Set(images.map(img => img.id)));

        setIsProcessing(true);
        setProcessingMsg(`Changement de fond HD (${targets.size} images)...`);

        try {
          const updated = [...images];
          for (let i = 0; i < updated.length; i++) {
            if (targets.has(updated[i].id)) {
              updated[i] = await processSingleImage(updated[i], bgConfig);
            }
          }
          setImages(updated);
          addToast('Fond Appliqué en HD !', `${targets.size} photo(s) sublimée(s) avec le nouveau décor ✨`, 'success');
        } catch (e) {
          console.error(e);
        } finally {
          setIsProcessing(false);
        }
      };

      // Custom Background Upload
      const handleCustomBg = (e) => {
        const file = e.target.files?.[0];

        const reader = new FileReader();
        reader.onload = (event) => {
          applyBackground({ type: 'image', url: event.target.result });

        reader.readAsDataURL(file);

      const applyCrop = async (ratio) => {
        const targets = selectedIds.size > 0 ? selectedIds : new Set(images.map(img => img.id));
        setIsProcessing(true);
        setProcessingMsg('Recadrage en cours...');
        try {
          const updated = [...images];
          for (let i = 0; i < updated.length; i++) {
            if (targets.has(updated[i].id)) {
              const item = updated[i];
              const img = new Image();
              img.src = item.currentUrl;
              await new Promise(res => { img.onload = res; });
              const w = img.naturalWidth;
              const h = img.naturalHeight;
              let tw = w;
              let th = h;
              if (ratio === '1:1') { tw = Math.min(w, h); th = tw; }
              else if (ratio === '16:9') { th = Math.round(w * (9 / 16)); }
              else if (ratio === '9:16') { tw = Math.round(h * (9 / 16)); }

              const canvas = document.createElement('canvas');
              canvas.width = tw;
              canvas.height = th;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, (w - tw) / 2, (h - th) / 2, tw, th, 0, 0, tw, th);
              updated[i] = { ...item, currentUrl: canvas.toDataURL('image/png'), width: tw, height: th, isModified: true };
            }
          }
          setImages(updated);
          addToast('Recadrage appliqué', `Ratio ${ratio} appliqué`, 'success');
        } finally {
          setIsProcessing(false);
        }

        try {

              const item = updated[i];
              const img = new Image();
              img.src = item.currentUrl;
              await new Promise(res => { img.onload = res; });
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              updated[i] = { ...item, currentUrl: canvas.toDataURL('image/png'), width: w, height: h, isModified: true };

                          >
                            <img src={s.url} alt={s.label} className="absolute inset-0 w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent"></div>
                            <span className="relative z-10 text-[10px] font-bold text-white truncate">{s.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 5. NATURE & LANDSCAPES HD (20 CHOICES) */}
                  {bgCategory === 'nature' && (
                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 20 Paysages Nature, Montagnes & Plages HD :
                      </span>
                      <div className="grid grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-1">
                        {filteredNature.map(n => (
                          <button
                            key={n.id}
                            onClick={() => applyBackground({ type: 'image', url: n.url })}
                            className="relative h-20 rounded-xl overflow-hidden border border-slate-700 hover:border-indigo-500 hover:scale-[1.02] transition-all text-left flex flex-col justify-end p-2 bg-slate-900 shadow-md"
                          >
                            <img src={n.url} alt={n.label} className="absolute inset-0 w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent"></div>
                            <span className="relative z-10 text-[10px] font-bold text-white truncate">{n.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 6. CITIES & CYBERPUNK HD (20 CHOICES) */}
                  {bgCategory === 'cities' && (
                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 20 Villes, Cyberpunk & Architecture HD :
                      </span>
                      <div className="grid grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-1">
                        {filteredCities.map(c => (
                          <button
                            key={c.id}
                            onClick={() => applyBackground({ type: 'image', url: c.url })}
                            className="relative h-20 rounded-xl overflow-hidden border border-slate-700 hover:border-indigo-500 hover:scale-[1.02] transition-all text-left flex flex-col justify-end p-2 bg-slate-900 shadow-md"
                          >
                            <img src={c.url} alt={c.label} className="absolute inset-0 w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent"></div>
                            <span className="relative z-10 text-[10px] font-bold text-white truncate">{c.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Custom Background Upload */}
                  <div className="pt-2 border-t border-slate-800">
                    <label className="w-full py-2.5 px-3 rounded-xl border border-dashed border-slate-700 hover:border-indigo-500 bg-slate-950/40 flex items-center justify-center gap-2 text-xs font-semibold text-slate-300 cursor-pointer transition-all">
                      <Icon name="image" className="w-4 h-4 text-indigo-400" />
                      <span>Importer un fond personnalisé (depuis PC)</span>
                      <input type="file" accept="image/*" className="hidden" onChange={handleCustomBg} />
                    </label>
                  </div>

                </div>
              )}

              {/* TAB 2: CROP */}
              {activeTab === 'crop' && (
                <div className="flex flex-col gap-4">
                  <span className="text-xs font-bold text-slate-300">Ratios Prédéfinis en 1 Clic</span>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { id: '1:1', label: '1:1 Carré' },
                      { id: '16:9', label: '16:9 YouTube' },
                      { id: '9:16', label: '9:16 Story' },
                    ].map(r => (
                      <button
                        key={r.id}
                        onClick={() => applyCrop(r.id)}
                        className="py-3 px-2 rounded-xl bg-slate-950 hover:bg-indigo-600 border border-slate-800 hover:border-indigo-500 text-xs font-bold transition-all text-center"
                      >
                        {r.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: RESIZE */}
              {activeTab === 'resize' && (
                <div className="flex flex-col gap-4">
                  <span className="text-xs font-bold text-slate-300">Préréglages Sociaux en 1 Clic</span>
                  <div className="grid grid-cols-2 gap-2">
                    {[
                      { label: 'Instagram Carré', w: 1080, h: 1080 },
                      { label: 'Story / TikTok', w: 1080, h: 1920 },
                      { label: 'YouTube Miniature', w: 1920, h: 1080 },
                      { label: 'E-Commerce HD', w: 1200, h: 1200 },
                    ].map(p => (
                      <button
                        key={p.label}
                        onClick={() => applyResize(p.w, p.h)}
                        className="p-3 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500 text-left transition-all"
                      >
                        <p className="text-xs font-bold text-slate-200">{p.label}</p>
                        <p className="text-[10px] font-mono text-indigo-400">{p.w} × {p.h} px</p>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 4: WATERMARK */}
              {activeTab === 'watermark' && (
                <div className="flex flex-col gap-4">
                  <div className="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <span className="text-xs font-bold text-slate-200">Activer le Filigrane</span>
                    <input
                      type="checkbox"
                      checked={watermark.enabled}
                      onChange={(e) => setWatermark(prev => ({ ...prev, enabled: e.target.checked }))}
                      className="w-4 h-4 accent-indigo-600 cursor-pointer"
                    />
                  </div>

                  <div>
                    <span className="text-[11px] text-slate-400 block mb-1">Texte du Filigrane</span>
                    <input
                      type="text"
                      value={watermark.text}
                      onChange={(e) => setWatermark(prev => ({ ...prev, text: e.target.value }))}
                      className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white"
                    />
                  </div>
                </div>
              )}

            </aside>
          </div>

          {/* BEFORE / AFTER MODAL */}
          {comparingItem && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="relative w-full max-w-3xl bg-slate-900 rounded-3xl border border-slate-800 p-6 flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white">Comparaison Avant / Après</h3>
                  <button onClick={() => setComparingItem(null)} className="text-slate-400 hover:text-white">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="relative w-full h-[400px] bg-checkerboard flex items-center justify-center overflow-hidden rounded-2xl">
                  <img src={comparingItem.originalUrl} alt="Original" className="absolute inset-0 w-full h-full object-contain" />
                  <div style={{ clipPath: `inset(0 0 0 ${compareSlider}%)` }} className="absolute inset-0 w-full h-full">
                    <img src={comparingItem.currentUrl} alt="Modifié" className="w-full h-full object-contain" />
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="100"
                    value={compareSlider}
                    onChange={(e) => setCompareSlider(parseInt(e.target.value))}
                    className="absolute inset-0 opacity-0 cursor-ew-resize z-20 w-full h-full"
                  />
                  <div style={{ left: `${compareSlider}%` }} className="absolute top-0 bottom-0 w-1 bg-white pointer-events-none" />
                </div>
              </div>
            </div>
          )}

          {/* CERVEX MODAL */}
          {isCervexOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="relative w-full max-w-lg bg-slate-900 rounded-3xl border border-slate-800 p-6 flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Icon name="cpu" className="w-5 h-5 text-cervex-400" />
                    <span>Hub de Connexion Cervex</span>
                  </h3>
                  <button onClick={() => setIsCervexOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex flex-col gap-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Clé API Cervex</label>
                    <input type="password" value="crvx_live_9a87bf44d8e9" className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 font-mono" readOnly />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Projet ID</label>
                    <input type="text" value="project-ai-prod" className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 font-mono" readOnly />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                  <button
                    onClick={() => {
                      addToast('Cervex Sync', 'Synchronisation Cloud réussie (200 OK)', 'success');
                      setIsCervexOpen(false);
                    }}
                    className="px-4 py-2 rounded-xl bg-cervex-600 hover:bg-cervex-500 text-white font-bold text-xs"
                  >
                    Tester la synchronisation
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SPINNER OVERLAY */}
          {isProcessing && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col items-center gap-3">
                <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <p className="text-xs font-semibold text-slate-200">{processingMsg}</p>
              </div>
            </div>
          )}

          {/* TOASTS */}
          <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(toast => (
              <div key={toast.id} className="pointer-events-auto px-4 py-3 rounded-2xl bg-slate-900 border border-slate-700 shadow-2xl text-xs text-white">
                <span className="font-bold">{toast.title}</span> : <span className="text-slate-400">{toast.message}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
