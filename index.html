<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelBatch AI Studio — Éditeur par Lots & Suppression de Fond</title>
  <meta name="description" content="Studio SaaS ultra-rapide de traitement d'images par lots : détourage automatique, remplacement de fond en 1 clic, recadrage, redimensionnement et filigranes." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->

      darkMode: 'class',
      theme: {
        extend: {

            mono: ['"JetBrains Mono"', 'monospace'],

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }

    input[type=range] {

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;

<body class="bg-slate-950 text-slate-100 antialiased font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Embedded SVG Icons ---
    const Icon = ({ name, className = "w-5 h-5" }) => {
      switch (name) {
        case 'wand':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M15 4l5 5L8 21H3v-5L15 4zM18 1L23 6M1 18l3 3M9 2l1 2M2 9l2 1" /></svg>;
        case 'layers':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>;
        case 'sparkles':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6l2.1-2.1M12 8a4 4 0 100 8 4 4 0 000-8z" /></svg>;
        case 'upload':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
        case 'download':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>;
        case 'zip':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10" /></svg>;
        case 'trash':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
        case 'check':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12" /></svg>;
        case 'crop':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M6 2v14a2 2 0 002 2h14M18 22V8a2 2 0 00-2-2H2" /></svg>;
        case 'resize':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>;
        case 'stamp':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M5 22h14M5 2h14M12 6v8m-4 4h8a2 2 0 002-2v-2a2 2 0 00-2-2H8a2 2 0 00-2 2v2a2 2 0 002 2z" /></svg>;
        case 'palette':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M7 21a4 4 0 01-4-4 11.96 11.96 0 012.37-7.23A12 12 0 0118.66 4.7 9 9 0 0121 12a9 9 0 01-9 9h-5z" /><circle cx="7.5" cy="10.5" r="1.5"/><circle cx="12" cy="7.5" r="1.5"/><circle cx="16.5" cy="10.5" r="1.5"/></svg>;
        case 'split':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2" /><line x1="12" y1="3" x2="12" y2="21" /></svg>;
        case 'cpu':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M9 1v3m6-3v3m-6 17v3m6-3v3M1 9h3m-3 6h3m17-6h3m-3 6h3" /></svg>;
        case 'close':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg>;
        default:
          return null;
      }
    };

    // --- Background Presets ---
    const BG_SOLID_PRESETS = [
      { id: 'transparent', label: 'Transparent', value: 'transparent', class: 'bg-checkerboard' },
      { id: 'white', label: 'Blanc Studio', value: '#ffffff', class: 'bg-white' },
      { id: 'black', label: 'Noir Profond', value: '#0a0a0c', class: 'bg-black' },
      { id: 'indigo', label: 'Indigo Cyber', value: '#4f46e5', class: 'bg-indigo-600' },
      { id: 'emerald', label: 'Vert Émeraude', value: '#10b981', class: 'bg-emerald-500' },
      { id: 'orange', label: 'Orange Sunset', value: '#f97316', class: 'bg-orange-500' },
      { id: 'rose', label: 'Rose Bonbon', value: '#ec4899', class: 'bg-pink-500' },
      { id: 'slate', label: 'Gris Ardoise', value: '#334155', class: 'bg-slate-700' },
    ];

    const BG_GRADIENT_PRESETS = [
      { id: 'grad-sunset', label: 'Sunset Glow', colors: ['#f97316', '#ec4899', '#8b5cf6'], css: 'linear-gradient(135deg, #f97316, #ec4899, #8b5cf6)' },
      { id: 'grad-cyber', label: 'Cyber Neon', colors: ['#06b6d4', '#3b82f6', '#9333ea'], css: 'linear-gradient(135deg, #06b6d4, #3b82f6, #9333ea)' },
      { id: 'grad-emerald', label: 'Aurora Emerald', colors: ['#059669', '#10b981', '#06b6d4'], css: 'linear-gradient(135deg, #059669, #10b981, #06b6d4)' },
      { id: 'grad-cosmic', label: 'Cosmic Dark', colors: ['#1e1b4b', '#312e81', '#4c1d95'], css: 'linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95)' },
      { id: 'grad-gold', label: 'Champagne Luxe', colors: ['#d97706', '#f59e0b', '#fef3c7'], css: 'linear-gradient(135deg, #d97706, #f59e0b, #fef3c7)' },
      { id: 'grad-frost', label: 'Pure Frost', colors: ['#e0e7ff', '#c7d2fe', '#e2e8f0'], css: 'linear-gradient(135deg, #e0e7ff, #c7d2fe, #e2e8f0)' },
    ];

    // --- Main Component ---
    function App() {
      const [images, setImages] = useState([]);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [activeTab, setActiveTab] = useState('background');
      const [isProcessing, setIsProcessing] = useState(false);
      const [processingMsg, setProcessingMsg] = useState('');
      const [toasts, setToasts] = useState([]);

      // Compare Modal
      const [comparingItem, setComparingItem] = useState(null);
      const [compareSlider, setCompareSlider] = useState(50);

      // Cervex Modal
      const [isCervexOpen, setIsCervexOpen] = useState(false);

      // Background Tools
      const [autoCutout, setAutoCutout] = useState(true);
      const [tolerance, setTolerance] = useState(35);
      const [currentBg, setCurrentBg] = useState({ type: 'solid', value: '#ffffff' });

      // Crop
      const [cropRatio, setCropRatio] = useState('free');

      // Resize
      const [resizeSettings, setResizeSettings] = useState({ width: 1080, height: 1080, lock: true });

      // Watermark
      const [watermark, setWatermark] = useState({
        enabled: false,
        text: '© PIXELBATCH AI',
        color: '#ffffff',
        opacity: 85,
        position: 'bottom-right',
      });

      const addToast = (title, message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, title, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };

      // Handle Multiple File Upload
      const handleFiles = (files) => {
        if (!files || files.length === 0) return;
        const newImgs = [];
        const newIds = new Set(selectedIds);

        Array.from(files).forEach((file) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const url = e.target.result;
            const img = new Image();
            img.onload = () => {
              const id = 'img_' + Math.random().toString(36).substring(2, 9);
              newIds.add(id);
              setImages(prev => [
                ...prev,
                {
                  id,
                  name: file.name,
                  originalUrl: url,
                  currentUrl: url,
                  width: img.naturalWidth || 800,
                  height: img.naturalHeight || 800,
                  size: file.size,
                  isModified: false,
                }
              ]);
              setSelectedIds(new Set(newIds));
            };
            img.src = url;
          };
          reader.readAsDataURL(file);
        });

        addToast('Images importées', `${files.length} fichier(s) prêt(s). Cliquez sur un fond pour l'appliquer !`, 'success');
      };

      // Toggle Select
      const toggleSelect = (id) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      const selectAll = () => setSelectedIds(new Set(images.map(img => img.id)));
      const deselectAll = () => setSelectedIds(new Set());
      const deleteSelected = () => {
        setImages(prev => prev.filter(img => !selectedIds.has(img.id)));
        setSelectedIds(new Set());
        addToast('Suppression', 'Images supprimées', 'info');
      };

      const revertSelected = () => {
        setImages(prev => prev.map(img => {
          if (selectedIds.has(img.id)) {
            return { ...img, currentUrl: img.originalUrl, isModified: false };
          }
          return img;
        }));
        addToast('Restauré', 'Retour aux images originales', 'info');
      };

      // =========================================================================
      // --- CORE IMAGE ENGINE : Fast In-Browser Background Matting & Replacement ---
      // =========================================================================
      const processImage = async (item, bgConfig, options = {}) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.src = options.useOriginal ? item.originalUrl : item.currentUrl;

          img.onload = () => {
            try {
              const w = img.naturalWidth || item.width || 800;
              const h = img.naturalHeight || item.height || 800;

              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d', { willReadFrequently: true });

              // 1. Draw Background
              if (bgConfig.value !== 'transparent') {
                if (bgConfig.type === 'solid') {
                  ctx.fillStyle = bgConfig.value;
                  ctx.fillRect(0, 0, w, h);
                } else if (bgConfig.type === 'gradient' && bgConfig.colors) {
                  const grad = ctx.createLinearGradient(0, 0, w, h);
                  grad.addColorStop(0, bgConfig.colors[0]);
                  grad.addColorStop(0.5, bgConfig.colors[1]);
                  grad.addColorStop(1, bgConfig.colors[2]);
                  ctx.fillStyle = grad;
                  ctx.fillRect(0, 0, w, h);
                }
              }

              // 2. Intermediate Subject Canvas (For Cutout)
              const subCanvas = document.createElement('canvas');
              subCanvas.width = w;
              subCanvas.height = h;
              const sctx = subCanvas.getContext('2d', { willReadFrequently: true });
              sctx.drawImage(img, 0, 0, w, h);

              // 3. Smart Background Removal Algorithm
              if (autoCutout || options.forceCutout) {
                const imgData = sctx.getImageData(0, 0, w, h);
                const data = imgData.data;

                // Sample corners to identify background color
                const c1 = [data[0], data[1], data[2]];
                const c2 = [data[(w - 1) * 4], data[(w - 1) * 4 + 1], data[(w - 1) * 4 + 2]];
                const c3 = [data[(h - 1) * w * 4], data[(h - 1) * w * 4 + 1], data[(h - 1) * w * 4 + 2]];
                const c4 = [data[((h * w) - 1) * 4], data[((h * w) - 1) * 4 + 1], data[((h * w) - 1) * 4 + 2]];

                const bgR = Math.round((c1[0] + c2[0] + c3[0] + c4[0]) / 4);
                const bgG = Math.round((c1[1] + c2[1] + c3[1] + c4[1]) / 4);
                const bgB = Math.round((c1[2] + c2[2] + c3[2] + c4[2]) / 4);

                const limit = tolerance * 3.2;

                for (let i = 0; i < data.length; i += 4) {
                  const r = data[i];
                  const g = data[i + 1];
                  const b = data[i + 2];

                  const dist = Math.sqrt(
                    Math.pow(r - bgR, 2) +
                    Math.pow(g - bgG, 2) +
                    Math.pow(b - bgB, 2)
                  );

                  // High-luminance white threshold or Euclidean color match
                  if (dist < limit || (r > 240 && g > 240 && b > 240 && bgR > 220)) {
                    const factor = Math.max(0, (dist / limit) - 0.2);
                    data[i + 3] = Math.round(data[i + 3] * factor);
                  }
                }
                sctx.putImageData(imgData, 0, 0);
              }

              // Draw cutout subject onto the background
              ctx.drawImage(subCanvas, 0, 0);

              // 4. Watermark if enabled
              if (watermark.enabled && watermark.text) {
                ctx.save();
                ctx.globalAlpha = watermark.opacity / 100;
                const fontSize = Math.max(16, Math.round(w * 0.035));
                ctx.font = `700 ${fontSize}px "Plus Jakarta Sans", sans-serif`;

                const metrics = ctx.measureText(watermark.text);
                const wx = w - metrics.width - 30;
                const wy = h - 30;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.beginPath();
                ctx.roundRect(wx - 12, wy - fontSize - 6, metrics.width + 24, fontSize + 16, 8);
                ctx.fill();

                ctx.fillStyle = watermark.color;
                ctx.fillText(watermark.text, wx, wy);
                ctx.restore();
              }

              const resultUrl = canvas.toDataURL('image/png', 0.95);
              resolve({
                ...item,
                currentUrl: resultUrl,
                isModified: true,
              });
            } catch (err) {
              reject(err);
            }
          };
          img.onerror = reject;
        });
      };

      // Apply Background to Selection Instantly on Click!
      const applyBackgroundInstantly = async (bgConfig) => {
        if (images.length === 0) {
          addToast('Aucune image', 'Déposez d’abord une ou plusieurs images dans la zone de gauche !', 'warning');
          return;
        }

        const targets = selectedIds.size > 0 ? selectedIds : new Set(images.map(img => img.id));
        if (selectedIds.size === 0) {
          setSelectedIds(new Set(images.map(img => img.id)));
        }

        setCurrentBg(bgConfig);
        setIsProcessing(true);
        setProcessingMsg(`Application du fond sur ${targets.size} image(s)...`);

        try {
          const updated = [...images];
          for (let i = 0; i < updated.length; i++) {
            if (targets.has(updated[i].id)) {
              updated[i] = await processImage(updated[i], bgConfig, { useOriginal: true, forceCutout: autoCutout });
            }
          }
          setImages(updated);
          addToast('Fond Appliqué !', `${targets.size} image(s) modifiée(s) avec succès ✨`, 'success');
        } catch (e) {
          console.error(e);
          addToast('Erreur', 'Impossible d’appliquer le fond', 'error');
        } finally {
          setIsProcessing(false);
        }
      };

      // Crop Apply
      const applyCrop = async (ratio) => {
        if (images.length === 0) return;
        const targets = selectedIds.size > 0 ? selectedIds : new Set(images.map(img => img.id));
        setIsProcessing(true);
        setProcessingMsg('Recadrage en cours...');

        try {
          const updated = [...images];
          for (let i = 0; i < updated.length; i++) {
            if (targets.has(updated[i].id)) {
              const item = updated[i];
              const img = new Image();
              img.src = item.currentUrl;
              await new Promise(res => { img.onload = res; });

              const origW = img.naturalWidth;
              const origH = img.naturalHeight;
              let targetW = origW;
              let targetH = origH;

              if (ratio === '1:1') {
                targetW = Math.min(origW, origH);
                targetH = targetW;
              } else if (ratio === '16:9') {
                targetH = Math.round(origW * (9 / 16));
                targetW = origW;
              } else if (ratio === '9:16') {
                targetW = Math.round(origH * (9 / 16));
                targetH = origH;
              }

              const canvas = document.createElement('canvas');
              canvas.width = targetW;
              canvas.height = targetH;
              const ctx = canvas.getContext('2d');
              const sx = Math.max(0, (origW - targetW) / 2);
              const sy = Math.max(0, (origH - targetH) / 2);

              ctx.drawImage(img, sx, sy, targetW, targetH, 0, 0, targetW, targetH);
              updated[i] = {
                ...item,
                currentUrl: canvas.toDataURL('image/png'),
                width: targetW,
                height: targetH,
                isModified: true,
              };
            }
          }
          setImages(updated);
          addToast('Recadrage appliqué', `Ratio ${ratio} appliqué à la sélection`, 'success');
        } catch (e) {
          console.error(e);
        } finally {
          setIsProcessing(false);
        }
      };

      // Resize Apply
      const applyResize = async (w, h) => {
        if (images.length === 0) return;
        const targets = selectedIds.size > 0 ? selectedIds : new Set(images.map(img => img.id));
        setIsProcessing(true);
        setProcessingMsg('Redimensionnement en cours...');

        try {
          const updated = [...images];
          for (let i = 0; i < updated.length; i++) {
            if (targets.has(updated[i].id)) {
              const item = updated[i];
              const img = new Image();
              img.src = item.currentUrl;
              await new Promise(res => { img.onload = res; });

              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);

              updated[i] = {
                ...item,
                currentUrl: canvas.toDataURL('image/png'),
                width: w,
                height: h,
                isModified: true,
              };
            }
          }
          setImages(updated);
          addToast('Redimensionnement terminé', `${w} × ${h} px`, 'success');
        } catch (e) {
          console.error(e);
        } finally {
          setIsProcessing(false);
        }
      };

      // Download Single
      const downloadSingle = (item) => {
        const a = document.createElement('a');
        a.download = `pixelbatch_${item.name.replace(/\.[^/.]+$/, '')}.png`;
        a.href = item.currentUrl;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        addToast('Téléchargement', a.download, 'success');
      };

      // Download All Zip
      const downloadZip = async () => {
        const targets = images.filter(img => selectedIds.has(img.id));
        if (targets.length === 0) {
          addToast('Attention', 'Cochez au moins une image pour l’export ZIP', 'warning');
          return;
        }

        setIsProcessing(true);
        setProcessingMsg('Compression ZIP...');
        try {
          const zip = new JSZip();
          const folder = zip.folder("pixelbatch_images");

          targets.forEach((item, i) => {
            const data = item.currentUrl.split(',')[1];
            folder.file(`image_${i + 1}_${item.name.replace(/\.[^/.]+$/, '')}.png`, data, { base64: true });
          });

          const blob = await zip.generateAsync({ type: 'blob' });
          saveAs(blob, `PixelBatch_Export_${Date.now()}.zip`);
          addToast('Export ZIP Terminé', `${targets.length} images compressées`, 'success');
        } catch (e) {
          console.error(e);
        } finally {
          setIsProcessing(false);
        }
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          {/* TOP NAVBAR */}
          <header className="sticky top-0 z-40 backdrop-blur-xl bg-slate-900/90 border-b border-slate-800 px-6 py-3.5 flex items-center justify-between shadow-xl">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                <Icon name="layers" className="w-6 h-6" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                    PixelBatch AI Studio
                  </span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                    SaaS PRO
                  </span>
                </div>
                <p className="text-[11px] text-slate-400">Éditeur & Traitement d'Images par Lots</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={() => setIsCervexOpen(true)}
                className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-cervex-600/10 hover:bg-cervex-600/20 text-cervex-400 border border-cervex-500/30 text-xs font-semibold"
              >
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Connecteur Cervex</span>
              </button>

              <button
                onClick={downloadZip}
                disabled={images.length === 0}
                className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white shadow-lg shadow-indigo-500/25 disabled:opacity-40"
              >
                <Icon name="zip" className="w-4 h-4" />
                <span>Télécharger tout (ZIP)</span>
              </button>
            </div>
          </header>

          {/* MAIN APP BODY */}
          <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
            
            {/* GALLERY AREA */}
            <main className="flex-1 p-6 overflow-y-auto flex flex-col gap-5">
              
              {/* Toolbar */}
              <div className="flex flex-wrap items-center justify-between gap-3 p-3 rounded-2xl bg-slate-900 border border-slate-800">
                <div className="flex items-center gap-2 text-xs">
                  <button onClick={selectAll} className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 font-semibold text-slate-200">
                    Tout cocher ({images.length})
                  </button>
                  <button onClick={deselectAll} className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400">
                    Tout décocher
                  </button>
                  <button onClick={revertSelected} className="px-3 py-1.5 rounded-lg border border-amber-500/30 text-amber-300 hover:bg-amber-500/10">
                    Restaurer originaux
                  </button>
                </div>

                <div className="flex items-center gap-2">
                  <label className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 cursor-pointer">
                    <Icon name="upload" className="w-3.5 h-3.5" />
                    <span>Ajouter des images</span>
                    <input type="file" multiple accept="image/*" className="hidden" onChange={(e) => handleFiles(e.target.files)} />
                  </label>

                  <button onClick={deleteSelected} className="p-1.5 rounded-lg border border-rose-500/30 text-rose-400 hover:bg-rose-500/10">
                    <Icon name="trash" className="w-4 h-4" />
                  </button>
                </div>
              </div>

              {/* Upload Drop Zone when empty */}
              {images.length === 0 ? (
                <div
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={(e) => {
                    e.preventDefault();
                    handleFiles(e.dataTransfer.files);
                  }}
                  className="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-3xl p-12 text-center bg-slate-900/40"
                >
                  <div className="w-20 h-20 rounded-3xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center mb-6">
                    <Icon name="upload" className="w-10 h-10 text-indigo-400" />
                  </div>
                  <h2 className="text-xl font-bold text-white mb-2">Glissez vos images ici</h2>
                  <p className="text-sm text-slate-400 max-w-md mb-6">Supporte JPG, PNG, WebP et SVG pour un traitement instantané.</p>
                  
                  <label className="px-6 py-3 rounded-xl font-bold text-sm bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-lg cursor-pointer">
                    Parcourir les fichiers
                    <input type="file" multiple accept="image/*" className="hidden" onChange={(e) => handleFiles(e.target.files)} />
                  </label>
                </div>
              ) : (
                /* Images Grid */
                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                  {images.map((item) => {
                    const isSelected = selectedIds.has(item.id);
                    return (
                      <div
                        key={item.id}
                        onClick={() => toggleSelect(item.id)}
                        className={`group relative rounded-2xl overflow-hidden border transition-all cursor-pointer bg-slate-900 flex flex-col ${
                          isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/40 shadow-xl' : 'border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        <div className="relative w-full aspect-video bg-checkerboard flex items-center justify-center p-2">
                          <img src={item.currentUrl} alt={item.name} className="w-full h-full object-contain" />
                          
                          {/* Checkbox */}
                          <div className="absolute top-3 left-3">
                            <div className={`w-6 h-6 rounded-lg flex items-center justify-center ${
                              isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-900/80 border border-slate-600 text-transparent'
                            }`}>
                              <Icon name="check" className="w-4 h-4" />
                            </div>
                          </div>

                          {/* Hover Actions */}
                          <div className="absolute inset-0 bg-slate-950/60 backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                setComparingItem(item);
                              }}
                              className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200"
                              title="Avant / Après"
                            >
                              <Icon name="split" className="w-4 h-4" />
                            </button>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                downloadSingle(item);
                              }}
                              className="p-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white"
                              title="Télécharger"
                            >
                              <Icon name="download" className="w-4 h-4" />
                            </button>
                          </div>
                        </div>

                        <div className="p-3 border-t border-slate-800 flex items-center justify-between text-xs">
                          <span className="font-semibold text-slate-200 truncate max-w-[160px]">{item.name}</span>
                          {item.isModified && (
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                              Fond Modifié
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </main>

            {/* SIDEBAR */}
            <aside className="w-full lg:w-96 bg-slate-900/95 border-t lg:border-t-0 lg:border-l border-slate-800 p-6 flex flex-col gap-5 shrink-0 shadow-2xl">
              
              <div className="flex items-center justify-between">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Outils par Lots</h3>
                <span className="text-xs font-mono text-indigo-400">{selectedIds.size} sélectionnée(s)</span>
              </div>

              {/* Tabs */}
              <div className="grid grid-cols-4 gap-1.5 p-1 rounded-xl bg-slate-950 border border-slate-800">
                {[
                  { id: 'background', label: 'Fond', icon: 'palette' },
                  { id: 'crop', label: 'Recadrer', icon: 'crop' },
                  { id: 'resize', label: 'Taille', icon: 'resize' },
                  { id: 'watermark', label: 'Filigrane', icon: 'stamp' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`py-2 px-1.5 rounded-lg text-xs font-semibold flex flex-col items-center gap-1 transition-all ${
                      activeTab === tab.id ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <Icon name={tab.icon} className="w-4 h-4" />
                    <span>{tab.label}</span>
                  </button>
                ))}
              </div>

              {/* TAB 1: BACKGROUND (CLICK = INSTANT APPLY) */}
              {activeTab === 'background' && (
                <div className="flex flex-col gap-4">
                  
                  {/* Auto Cutout Switch */}
                  <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 flex flex-col gap-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                        <Icon name="wand" className="w-4 h-4 text-indigo-400" />
                        Détourage IA Automatique
                      </span>
                      <input
                        type="checkbox"
                        checked={autoCutout}
                        onChange={(e) => setAutoCutout(e.target.checked)}
                        className="w-4 h-4 accent-indigo-600 cursor-pointer"
                      />
                    </div>
                    <p className="text-[11px] text-slate-400">Supprime le fond actuel et peint le nouveau fond derrière le sujet.</p>
                    
                    {autoCutout && (
                      <div className="pt-2 border-t border-slate-800 flex flex-col gap-1">
                        <div className="flex justify-between text-[10px] text-slate-400">
                          <span>Tolérance de détection</span>
                          <span className="font-mono text-indigo-400 font-bold">{tolerance}</span>
                        </div>
                        <input
                          type="range"
                          min="10"
                          max="80"
                          value={tolerance}
                          onChange={(e) => setTolerance(parseInt(e.target.value))}
                        />
                      </div>
                    )}
                  </div>

                  {/* Solid Colors */}
                  <div>
                    <span className="text-[11px] text-slate-400 font-bold block mb-2">
                      👉 Cliquez sur un fond pour l'appliquer instantanément :
                    </span>
                    <div className="grid grid-cols-4 gap-2">
                      {BG_SOLID_PRESETS.map(color => (
                        <button
                          key={color.id}
                          onClick={() => applyBackgroundInstantly({ type: 'solid', value: color.value })}
                          className={`h-10 rounded-xl border transition-all hover:scale-105 flex items-center justify-center ${color.class} ${
                            currentBg.value === color.value ? 'ring-2 ring-indigo-500 border-white' : 'border-slate-700'
                          }`}
                          title={`Appliquer ${color.label}`}
                        >
                          {currentBg.value === color.value && (
                            <Icon name="check" className={`w-4 h-4 ${color.value === '#ffffff' ? 'text-black' : 'text-white'}`} />
                          )}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Gradients */}
                  <div>
                    <span className="text-[11px] text-slate-400 font-bold block mb-2">Dégradés Modernes (1 Clic)</span>
                    <div className="grid grid-cols-3 gap-2">
                      {BG_GRADIENT_PRESETS.map(grad => (
                        <button
                          key={grad.id}
                          onClick={() => applyBackgroundInstantly({ type: 'gradient', colors: grad.colors, value: grad.id })}
                          style={{ background: grad.css }}
                          className={`h-10 rounded-xl border border-slate-700 transition-all hover:scale-105 flex items-center justify-center ${
                            currentBg.value === grad.id ? 'ring-2 ring-indigo-500 border-white' : ''
                          }`}
                          title={`Appliquer ${grad.label}`}
                        >
                          {currentBg.value === grad.id && <Icon name="check" className="w-4 h-4 text-white drop-shadow" />}
                        </button>
                      ))}
                    </div>
                  </div>

                </div>
              )}

              {/* TAB 2: CROP */}
              {activeTab === 'crop' && (
                <div className="flex flex-col gap-4">
                  <span className="text-[11px] text-slate-400 font-bold">Ratios d'Aspect en 1 Clic</span>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { id: '1:1', label: '1:1 Carré' },
                      { id: '16:9', label: '16:9 Paysage' },
                      { id: '9:16', label: '9:16 Story' },
                    ].map(r => (
                      <button
                        key={r.id}
                        onClick={() => applyCrop(r.id)}
                        className="py-3 px-2 rounded-xl bg-slate-950 hover:bg-indigo-600 border border-slate-800 hover:border-indigo-500 text-xs font-bold transition-all text-center"
                      >
                        {r.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: RESIZE */}
              {activeTab === 'resize' && (
                <div className="flex flex-col gap-4">
                  <span className="text-[11px] text-slate-400 font-bold">Préréglages Sociaux (1 Clic)</span>
                  <div className="grid grid-cols-2 gap-2">
                    {[
                      { label: 'Instagram Carré', w: 1080, h: 1080 },
                      { label: 'Story / TikTok', w: 1080, h: 1920 },
                      { label: 'YouTube Miniature', w: 1920, h: 1080 },
                      { label: 'E-Commerce HD', w: 1200, h: 1200 },
                    ].map(p => (
                      <button
                        key={p.label}
                        onClick={() => applyResize(p.w, p.h)}
                        className="p-3 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500 text-left transition-all"
                      >
                        <p className="text-xs font-bold text-slate-200">{p.label}</p>
                        <p className="text-[10px] font-mono text-indigo-400">{p.w} × {p.h} px</p>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 4: WATERMARK */}
              {activeTab === 'watermark' && (
                <div className="flex flex-col gap-4">
                  <div className="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <span className="text-xs font-bold text-slate-200">Activer le Filigrane</span>
                    <input
                      type="checkbox"
                      checked={watermark.enabled}
                      onChange={(e) => {
                        const val = e.target.checked;
                        setWatermark(prev => ({ ...prev, enabled: val }));
                        if (val) {
                          applyBackgroundInstantly(currentBg);
                        }
                      }}
                      className="w-4 h-4 accent-indigo-600 cursor-pointer"
                    />
                  </div>

                  <div>
                    <span className="text-[11px] text-slate-400 block mb-1">Texte du Filigrane</span>
                    <input
                      type="text"
                      value={watermark.text}
                      onChange={(e) => setWatermark(prev => ({ ...prev, text: e.target.value }))}
                      className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white"
                    />
                  </div>

                  <button
                    onClick={() => applyBackgroundInstantly(currentBg)}
                    className="w-full py-3 rounded-xl font-bold text-xs bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg"
                  >
                    Mettre à jour le filigrane
                  </button>
                </div>
              )}

            </aside>
          </div>

          {/* BEFORE / AFTER MODAL */}
          {comparingItem && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="relative w-full max-w-3xl bg-slate-900 rounded-3xl border border-slate-800 p-6 flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white">Comparaison Avant / Après</h3>
                  <button onClick={() => setComparingItem(null)} className="text-slate-400 hover:text-white">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="relative w-full h-[400px] bg-checkerboard flex items-center justify-center overflow-hidden rounded-2xl">
                  <img src={comparingItem.originalUrl} alt="Original" className="absolute inset-0 w-full h-full object-contain" />
                  <div style={{ clipPath: `inset(0 0 0 ${compareSlider}%)` }} className="absolute inset-0 w-full h-full">
                    <img src={comparingItem.currentUrl} alt="Modifié" className="w-full h-full object-contain" />
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="100"
                    value={compareSlider}
                    onChange={(e) => setCompareSlider(parseInt(e.target.value))}
                    className="absolute inset-0 opacity-0 cursor-ew-resize z-20 w-full h-full"
                  />
                  <div style={{ left: `${compareSlider}%` }} className="absolute top-0 bottom-0 w-1 bg-white pointer-events-none" />
                </div>
              </div>
            </div>
          )}

          {/* CERVEX MODAL */}
          {isCervexOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="relative w-full max-w-lg bg-slate-900 rounded-3xl border border-slate-800 p-6 flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Icon name="cpu" className="w-5 h-5 text-cervex-400" />
                    <span>Hub de Connexion Cervex</span>
                  </h3>
                  <button onClick={() => setIsCervexOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex flex-col gap-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Clé API Cervex</label>
                    <input type="password" value="crvx_live_9a87bf44d8e9" className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 font-mono" readOnly />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Projet ID</label>
                    <input type="text" value="project-ai-prod" className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 font-mono" readOnly />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                  <button
                    onClick={() => {
                      addToast('Cervex Sync', 'Synchronisation Cloud réussie (200 OK)', 'success');
                      setIsCervexOpen(false);
                    }}
                    className="px-4 py-2 rounded-xl bg-cervex-600 hover:bg-cervex-500 text-white font-bold text-xs"
                  >
                    Tester la synchronisation
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* LOADING SPINNER OVERLAY */}
          {isProcessing && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col items-center gap-3">
                <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <p className="text-xs font-semibold text-slate-200">{processingMsg}</p>
              </div>
            </div>
          )}

          {/* TOASTS */}
          <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(toast => (
              <div key={toast.id} className="pointer-events-auto px-4 py-3 rounded-2xl bg-slate-900 border border-slate-700 shadow-2xl text-xs text-white">
                <span className="font-bold">{toast.title}</span> : <span className="text-slate-400">{toast.message}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
