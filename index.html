    // --- Main App Component ---
    function App() {
      const [images, setImages] = useState([]);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [activeTab, setActiveTab] = useState('background');
      const [bgCategory, setBgCategory] = useState('cartoons'); // 'cartoons' | 'solids' | 'gradients' | 'photos' | 'custom'
      const [isProcessing, setIsProcessing] = useState(false);
      const [processingMsg, setProcessingMsg] = useState('');
      const [toasts, setToasts] = useState([]);

      // Before/After Modal
      const [comparingItem, setComparingItem] = useState(null);
      const [compareSlider, setCompareSlider] = useState(50);

      // Cervex Modal
      const [isCervexOpen, setIsCervexOpen] = useState(false);

      // Background State
      const [autoCutout, setAutoCutout] = useState(true);
      const [tolerance, setTolerance] = useState(28);
      const [customBgUrl, setCustomBgUrl] = useState(null);

      // Watermark
      const [watermark, setWatermark] = useState({
        enabled: false,
        text: '© PIXELBATCH AI',
        color: '#ffffff',
        opacity: 85,
      });

      const addToast = (title, message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, title, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };

      // Load initial Demo Library
      useEffect(() => {
        const initial = DEMO_LIBRARY.slice(0, 6).map(d => ({
          id: d.id,
          name: d.name,
          originalUrl: d.url,
          currentUrl: d.url,
          width: 1200,
          height: 1200,
          isModified: false,
        }));
        setImages(initial);
        setSelectedIds(new Set(initial.map(img => img.id)));
      }, []);

      // File Upload Handler
      const handleFiles = (files) => {
        if (!files || files.length === 0) return;
        const newImgs = [];
        const newIds = new Set(selectedIds);

        Array.from(files).forEach((file) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const url = e.target.result;
            const img = new Image();
            img.onload = () => {
              const id = 'img_' + Math.random().toString(36).substring(2, 9);
              newIds.add(id);
              setImages(prev => [
                ...prev,
                {
                  id,
                  name: file.name,
                  originalUrl: url,
                  currentUrl: url,
                  width: img.naturalWidth || 1000,
                  height: img.naturalHeight || 1000,
                  isModified: false,
                }
              ]);
              setSelectedIds(new Set(newIds));
            };
            img.src = url;
          };
          reader.readAsDataURL(file);
        });

        addToast('Images Prêtes !', `${files.length} image(s) importée(s) en Haute Définition.`, 'success');
      };

      // Add Demos Button
      const addMoreDemos = () => {
        const allFormatted = DEMO_LIBRARY.map(d => ({
          id: 'demo_' + Math.random().toString(36).substring(2, 7),
          name: d.name,
          originalUrl: d.url,
          currentUrl: d.url,
          width: 1200,
          height: 1200,
          isModified: false,
        }));
        setImages(allFormatted);
        setSelectedIds(new Set(allFormatted.map(img => img.id)));
        addToast('Catalogue Démo Chargé', '8 images variées prêtes pour le traitement !', 'success');
      };

      // Selection helpers
      const toggleSelect = (id) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      };

      const selectAll = () => setSelectedIds(new Set(images.map(img => img.id)));
      const deselectAll = () => setSelectedIds(new Set());
      const revertSelected = () => {
        setImages(prev => prev.map(img => {
          if (selectedIds.has(img.id)) {
            return { ...img, currentUrl: img.originalUrl, isModified: false };
          }
          return img;
        }));
        addToast('Restauré', 'Retour aux photos d’origine', 'info');
      };
      const deleteSelected = () => {
        setImages(prev => prev.filter(img => !selectedIds.has(img.id)));
        setSelectedIds(new Set());
        addToast('Supprimé', 'Images sélectionnées supprimées', 'info');
      };

      // =========================================================================
      // --- ULTRA CRISP HD CANVAS ENGINE : PRESERVES 100% QUALITY OF SUBJECT ---
      // =========================================================================
      const processSingleImage = async (item, bgConfig) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.src = item.originalUrl; // ALWAYS process from the crystal-clear original!

          img.onload = async () => {
            try {
              const w = img.naturalWidth || item.width || 1200;
              const h = img.naturalHeight || item.height || 1200;

              // Output Canvas at native HD resolution
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d', { willReadFrequently: true });

              // 1. Paint Background
              if (bgConfig.value !== 'transparent') {
                if (bgConfig.type === 'solid') {
                  ctx.fillStyle = bgConfig.value;
                  ctx.fillRect(0, 0, w, h);
                } else if (bgConfig.type === 'gradient') {
                  const grad = ctx.createLinearGradient(0, 0, w, h);
                  grad.addColorStop(0, bgConfig.colors[0]);
                  grad.addColorStop(0.5, bgConfig.colors[1]);
                  grad.addColorStop(1, bgConfig.colors[2]);
                  ctx.fillStyle = grad;
                  ctx.fillRect(0, 0, w, h);
                } else if (bgConfig.type === 'image' && bgConfig.url) {
                  try {
                    const bgImg = new Image();
                    bgImg.crossOrigin = 'anonymous';
                    await new Promise((res, rej) => {
                      bgImg.onload = res;
                      bgImg.onerror = rej;
                      bgImg.src = bgConfig.url;
                    });
                    ctx.drawImage(bgImg, 0, 0, w, h);
                  } catch (e) {
                    console.warn('Erreur chargement image fond:', e);
                  }
                }
              }

              // 2. High-Precision Subject Extraction (Preserves 100% HD subject detail)
              const subCanvas = document.createElement('canvas');
              subCanvas.width = w;
              subCanvas.height = h;
              const sctx = subCanvas.getContext('2d', { willReadFrequently: true });
              sctx.drawImage(img, 0, 0, w, h);

              if (autoCutout) {
                const imgData = sctx.getImageData(0, 0, w, h);
                const data = imgData.data;

                // Sample corners and borders for background detection
                const samples = [
                  [data[0], data[1], data[2]],
                  [data[(w - 1) * 4], data[(w - 1) * 4 + 1], data[(w - 1) * 4 + 2]],
                  [data[(h - 1) * w * 4], data[(h - 1) * w * 4 + 1], data[(h - 1) * w * 4 + 2]],
                  [data[((h * w) - 1) * 4], data[((h * w) - 1) * 4 + 1], data[((h * w) - 1) * 4 + 2]],
                ];

                const bgR = Math.round(samples.reduce((a, s) => a + s[0], 0) / 4);
                const bgG = Math.round(samples.reduce((a, s) => a + s[1], 0) / 4);
                const bgB = Math.round(samples.reduce((a, s) => a + s[2], 0) / 4);

                const limit = tolerance * 2.8;

                for (let i = 0; i < data.length; i += 4) {
                  const r = data[i];
                  const g = data[i + 1];
                  const b = data[i + 2];

                  const dist = Math.sqrt(
                    Math.pow(r - bgR, 2) +
                    Math.pow(g - bgG, 2) +
                    Math.pow(b - bgB, 2)
                  );

                  // Keep subject 100% untouched and opaque; only dissolve the detected background
                  if (dist < limit || (r > 245 && g > 245 && b > 245 && bgR > 230)) {
                    const alpha = Math.max(0, (dist / limit) - 0.25);
                    data[i + 3] = Math.round(data[i + 3] * alpha);
                  }
                }
                sctx.putImageData(imgData, 0, 0);
              }

              // Draw crystal-clear subject onto new background
              ctx.drawImage(subCanvas, 0, 0);

              // 3. Optional Watermark
              if (watermark.enabled && watermark.text) {
                ctx.save();
                ctx.globalAlpha = watermark.opacity / 100;
                const fontSize = Math.max(16, Math.round(w * 0.035));
                ctx.font = `700 ${fontSize}px "Plus Jakarta Sans", sans-serif`;

                const metrics = ctx.measureText(watermark.text);
                const wx = w - metrics.width - 40;
                const wy = h - 40;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
                ctx.beginPath();
                ctx.roundRect(wx - 14, wy - fontSize - 6, metrics.width + 28, fontSize + 18, 10);
                ctx.fill();

                ctx.fillStyle = watermark.color;
                ctx.fillText(watermark.text, wx, wy);
                ctx.restore();
              }

              // High-resolution lossless PNG output
              const resultUrl = canvas.toDataURL('image/png');
              resolve({
                ...item,
                currentUrl: resultUrl,
                isModified: true,
              });

            } catch (err) {
              reject(err);
            }
          };
          img.onerror = reject;
        });
      };

      // 1-Click Instant Batch Background Changer
      const applyBackground = async (bgConfig) => {
        if (images.length === 0) {
          addToast('Aucune image', 'Importez d’abord des images ou cliquez sur "Charger des Démos"', 'warning');
          return;
        }

        const targets = selectedIds.size > 0 ? selectedIds : new Set(images.map(img => img.id));
        if (selectedIds.size === 0) {
          setSelectedIds(new Set(images.map(img => img.id)));
        }

        setIsProcessing(true);
        setProcessingMsg(`Changement de fond HD (${targets.size} images)...`);

        try {
          const updated = [...images];
          for (let i = 0; i < updated.length; i++) {
            if (targets.has(updated[i].id)) {
              updated[i] = await processSingleImage(updated[i], bgConfig);
            }
          }
          setImages(updated);
          addToast('Fond Appliqué en HD !', `Vos ${targets.size} photos conservent 100% de leur netteté ✨`, 'success');
        } catch (e) {
          console.error(e);
          addToast('Erreur', 'Erreur lors de l’application', 'error');
        } finally {
          setIsProcessing(false);
        }
      };

      // Custom Background Upload
      const handleCustomBg = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const bgData = event.target.result;
          setCustomBgUrl(bgData);
          applyBackground({ type: 'image', url: bgData });
        };
        reader.readAsDataURL(file);
      };

      // Crop
      const applyCrop = async (ratio) => {
        const targets = selectedIds.size > 0 ? selectedIds : new Set(images.map(img => img.id));
        setIsProcessing(true);
        setProcessingMsg('Recadrage en cours...');
        try {
          const updated = [...images];
          for (let i = 0; i < updated.length; i++) {
            if (targets.has(updated[i].id)) {
              const item = updated[i];
              const img = new Image();
              img.src = item.currentUrl;
              await new Promise(res => { img.onload = res; });
              const w = img.naturalWidth;
              const h = img.naturalHeight;
              let tw = w;
              let th = h;
              if (ratio === '1:1') { tw = Math.min(w, h); th = tw; }
              else if (ratio === '16:9') { th = Math.round(w * (9 / 16)); }
              else if (ratio === '9:16') { tw = Math.round(h * (9 / 16)); }

              const canvas = document.createElement('canvas');
              canvas.width = tw;
              canvas.height = th;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, (w - tw) / 2, (h - th) / 2, tw, th, 0, 0, tw, th);
              updated[i] = { ...item, currentUrl: canvas.toDataURL('image/png'), width: tw, height: th, isModified: true };
            }
          }
          setImages(updated);
          addToast('Recadrage effectué', `Ratio ${ratio} appliqué`, 'success');
        } finally {
          setIsProcessing(false);
        }
      };

      // Resize
      const applyResize = async (w, h) => {
        const targets = selectedIds.size > 0 ? selectedIds : new Set(images.map(img => img.id));
        setIsProcessing(true);
        setProcessingMsg('Redimensionnement...');
        try {
          const updated = [...images];
          for (let i = 0; i < updated.length; i++) {
            if (targets.has(updated[i].id)) {
              const item = updated[i];
              const img = new Image();
              img.src = item.currentUrl;
              await new Promise(res => { img.onload = res; });
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              updated[i] = { ...item, currentUrl: canvas.toDataURL('image/png'), width: w, height: h, isModified: true };
            }
          }
          setImages(updated);
          addToast('Redimensionné', `${w} × ${h} px`, 'success');
        } finally {
          setIsProcessing(false);
        }
      };

      // Download Single
      const downloadSingle = (item) => {
        const a = document.createElement('a');
        a.download = `pixelbatch_${item.name.replace(/\.[^/.]+$/, '')}.png`;
        a.href = item.currentUrl;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        addToast('Téléchargé', a.download, 'success');
      };

      // Download Zip
      const downloadZip = async () => {
        const targets = images.filter(img => selectedIds.has(img.id));
        if (targets.length === 0) return;
        setIsProcessing(true);
        setProcessingMsg('Compression de l’archive ZIP...');
        try {
          const zip = new JSZip();
          const folder = zip.folder("pixelbatch_hd_images");
          targets.forEach((item, i) => {
            const data = item.currentUrl.split(',')[1];
            folder.file(`image_${i + 1}_${item.name.replace(/\.[^/.]+$/, '')}.png`, data, { base64: true });
          });
          const blob = await zip.generateAsync({ type: 'blob' });
          saveAs(blob, `PixelBatch_Export_${Date.now()}.zip`);
          addToast('ZIP Prêt !', `${targets.length} images compressées`, 'success');
        } finally {
          setIsProcessing(false);
        }
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          
          {/* HEADER */}
          <header className="sticky top-0 z-40 backdrop-blur-xl bg-slate-900/90 border-b border-slate-800 px-6 py-3.5 flex items-center justify-between shadow-xl">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                <Icon name="layers" className="w-6 h-6" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-indigo-100 to-slate-400 bg-clip-text text-transparent">
                    PixelBatch AI Studio
                  </span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">
                    HD ULTRA
                  </span>
                </div>
                <p className="text-[11px] text-slate-400">Changement de fond instantané & Qualité photo 100% préservée</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={addMoreDemos}
                className="hidden sm:flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold"
              >
                <Icon name="sparkles" className="w-4 h-4 text-amber-400" />
                <span>Charger 8 Démos</span>
              </button>

              <button
                onClick={() => setIsCervexOpen(true)}
                className="hidden sm:flex items-center gap-2 px-3 py-2 rounded-xl bg-cervex-600/10 hover:bg-cervex-600/20 text-cervex-400 border border-cervex-500/30 text-xs font-semibold"
              >
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Connecteur Cervex</span>
              </button>

              <button
                onClick={downloadZip}
                disabled={images.length === 0}
                className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-indigo-500 via-indigo-600 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white shadow-lg shadow-indigo-500/25 disabled:opacity-40"
              >
                <Icon name="zip" className="w-4 h-4" />
                <span>Télécharger tout (ZIP)</span>
              </button>
            </div>
          </header>

          {/* WORKSPACE */}
          <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
            
            {/* GALLERY AREA */}
            <main className="flex-1 p-6 overflow-y-auto flex flex-col gap-5">
              
              {/* Top Action Bar */}
              <div className="flex flex-wrap items-center justify-between gap-3 p-3 rounded-2xl bg-slate-900 border border-slate-800">
                <div className="flex items-center gap-2 text-xs">
                  <button onClick={selectAll} className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 font-semibold text-slate-200">
                    Tout cocher ({images.length})
                  </button>
                  <button onClick={deselectAll} className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400">
                    Tout décocher
                  </button>
                  <button onClick={revertSelected} className="px-3 py-1.5 rounded-lg border border-amber-500/30 text-amber-300 hover:bg-amber-500/10">
                    Restaurer originaux
                  </button>
                </div>

                <div className="flex items-center gap-2">
                  <label className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 cursor-pointer hover:bg-indigo-500/30 transition-all">
                    <Icon name="upload" className="w-3.5 h-3.5" />
                    <span>Glisser / Ajouter des photos</span>
                    <input type="file" multiple accept="image/*" className="hidden" onChange={(e) => handleFiles(e.target.files)} />
                  </label>

                  <button onClick={deleteSelected} className="p-1.5 rounded-lg border border-rose-500/30 text-rose-400 hover:bg-rose-500/10">
                    <Icon name="trash" className="w-4 h-4" />
                  </button>
                </div>
              </div>

              {/* Grid of Images */}
              {images.length === 0 ? (
                <div
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={(e) => {
                    e.preventDefault();
                    handleFiles(e.dataTransfer.files);
                  }}
                  className="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-3xl p-12 text-center bg-slate-900/40"
                >
                  <div className="w-20 h-20 rounded-3xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center mb-6">
                    <Icon name="upload" className="w-10 h-10 text-indigo-400 animate-bounce" />
                  </div>
                  <h2 className="text-xl font-bold text-white mb-2">Glissez vos photos ici</h2>
                  <p className="text-sm text-slate-400 max-w-md mb-6">Vos photos restent en qualité HD intégrale. Le fond est remplacé en 1 clic.</p>
                  
                  <button onClick={addMoreDemos} className="px-6 py-3 rounded-xl font-bold text-sm bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-lg">
                    Charger des exemples de test
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                  {images.map((item) => {
                    const isSelected = selectedIds.has(item.id);
                    return (
                      <div
                        key={item.id}
                        onClick={() => toggleSelect(item.id)}
                        className={`group relative rounded-2xl overflow-hidden border transition-all cursor-pointer bg-slate-900 flex flex-col ${
                          isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/40 shadow-xl shadow-indigo-500/10' : 'border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        <div className="relative w-full aspect-video bg-checkerboard flex items-center justify-center p-2">
                          <img src={item.currentUrl} alt={item.name} className="w-full h-full object-contain transition-transform duration-200 group-hover:scale-105" />
                          
                          {/* Checkbox */}
                          <div className="absolute top-3 left-3 z-10">
                            <div className={`w-6 h-6 rounded-lg flex items-center justify-center ${
                              isSelected ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/50' : 'bg-slate-900/80 border border-slate-600 text-transparent'
                            }`}>
                              <Icon name="check" className="w-4 h-4" />
                            </div>
                          </div>

                          {/* Hover Actions */}
                          <div className="absolute inset-0 bg-slate-950/60 backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                setComparingItem(item);
                              }}
                              className="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200"
                              title="Avant / Après"
                            >
                              <Icon name="split" className="w-4 h-4" />
                            </button>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                downloadSingle(item);
                              }}
                              className="p-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white"
                              title="Télécharger"
                            >
                              <Icon name="download" className="w-4 h-4" />
                            </button>
                          </div>
                        </div>

                        <div className="p-3 border-t border-slate-800 flex items-center justify-between text-xs bg-slate-900/90">
                          <span className="font-semibold text-slate-200 truncate max-w-[160px]">{item.name}</span>
                          {item.isModified ? (
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                              Fond HD Modifié
                            </span>
                          ) : (
                            <span className="text-[10px] text-slate-500 font-mono">Original</span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </main>

            {/* EXPANDED CONTROL SIDEBAR */}
            <aside className="w-full lg:w-[420px] bg-slate-900/95 border-t lg:border-t-0 lg:border-l border-slate-800 p-6 flex flex-col gap-5 shrink-0 shadow-2xl overflow-y-auto">
              
              <div className="flex items-center justify-between">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Catalogue de Fonds</h3>
                <span className="text-xs font-mono text-indigo-400 font-bold">{selectedIds.size} sélectionnée(s)</span>
              </div>

              {/* Main Sidebar Tool Tabs */}
              <div className="grid grid-cols-4 gap-1 p-1 rounded-xl bg-slate-950 border border-slate-800">
                {[
                  { id: 'background', label: 'Fonds', icon: 'palette' },
                  { id: 'crop', label: 'Recadrer', icon: 'crop' },
                  { id: 'resize', label: 'Taille', icon: 'resize' },
                  { id: 'watermark', label: 'Filigrane', icon: 'stamp' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`py-2 px-1 rounded-lg text-xs font-semibold flex flex-col items-center gap-1 transition-all ${
                      activeTab === tab.id ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    <Icon name={tab.icon} className="w-4 h-4" />
                    <span>{tab.label}</span>
                  </button>
                ))}
              </div>

              {/* ================================================================= */}
              {/* --- TAB: BACKGROUNDS WITH HUGE RICH CATALOGUE --- */}
              {/* ================================================================= */}
              {activeTab === 'background' && (
                <div className="flex flex-col gap-4">
                  
                  {/* Subject Quality Protection Banner */}
                  <div className="p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-between">
                    <div>
                      <span className="text-xs font-bold text-indigo-300 flex items-center gap-1.5">
                        <Icon name="wand" className="w-4 h-4 text-indigo-400" />
                        Protection Qualité HD
                      </span>
                      <p className="text-[10px] text-slate-400">Le sujet reste 100% net et inaltéré.</p>
                    </div>
                    <input
                      type="checkbox"
                      checked={autoCutout}
                      onChange={(e) => setAutoCutout(e.target.checked)}
                      className="w-4 h-4 accent-indigo-600 cursor-pointer"
                    />
                  </div>

                  {/* Sub-Tabs: Background Categories */}
                  <div className="grid grid-cols-4 gap-1 p-1 rounded-xl bg-slate-950 border border-slate-800 text-[11px] font-bold">
                    <button
                      onClick={() => setBgCategory('cartoons')}
                      className={`py-1.5 rounded-lg transition-all ${bgCategory === 'cartoons' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                    >
                      🧸 Cartoons
                    </button>
                    <button
                      onClick={() => setBgCategory('solids')}
                      className={`py-1.5 rounded-lg transition-all ${bgCategory === 'solids' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                    >
                      🎨 Couleurs
                    </button>
                    <button
                      onClick={() => setBgCategory('gradients')}
                      className={`py-1.5 rounded-lg transition-all ${bgCategory === 'gradients' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                    >
                      🌈 Dégradés
                    </button>
                    <button
                      onClick={() => setBgCategory('photos')}
                      className={`py-1.5 rounded-lg transition-all ${bgCategory === 'photos' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                    >
                      📸 Photos HD
                    </button>
                  </div>

                  {/* 1. CARTOONS & 3D BACKGROUNDS */}
                  {bgCategory === 'cartoons' && (
                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 Cliquez sur un décor cartoon pour l'appliquer :
                      </span>
                      <div className="grid grid-cols-2 gap-2.5 max-h-72 overflow-y-auto pr-1">
                        {BG_CARTOONS.map(c => (
                          <button
                            key={c.id}
                            onClick={() => applyBackground(c)}
                            className="group relative h-24 rounded-2xl overflow-hidden border border-slate-700 hover:border-indigo-500 hover:scale-105 transition-all text-left flex flex-col justify-end p-2 bg-slate-900"
                          >
                            <img src={c.url} alt={c.label} className="absolute inset-0 w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                            <span className="relative z-10 text-[11px] font-bold text-white drop-shadow truncate">
                              {c.label}
                            </span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 2. PRO SOLID COLORS (16 COLORS + PICKER) */}
                  {bgCategory === 'solids' && (
                    <div className="flex flex-col gap-3">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 16 Couleurs Studio & Minimalistes :
                      </span>
                      <div className="grid grid-cols-4 gap-2">
                        {BG_SOLIDS.map(color => (
                          <button
                            key={color.id}
                            onClick={() => applyBackground({ type: 'solid', value: color.value })}
                            className={`h-11 rounded-xl border transition-all hover:scale-105 flex flex-col items-center justify-center ${color.class} border-slate-700`}
                            title={color.label}
                          >
                            <span className="text-[9px] font-bold px-1 rounded bg-black/40 text-white truncate max-w-[60px]">{color.label.split(' ')[0]}</span>
                          </button>
                        ))}
                      </div>

                      {/* Custom Hex Color */}
                      <div className="flex items-center gap-2 p-2 rounded-xl bg-slate-950 border border-slate-800">
                        <span className="text-xs text-slate-400">Couleur libre :</span>
                        <input
                          type="color"
                          defaultValue="#6366f1"
                          onChange={(e) => applyBackground({ type: 'solid', value: e.target.value })}
                          className="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0"
                        />
                        <span className="text-xs font-mono text-indigo-400">Choisir sur la palette</span>
                      </div>
                    </div>
                  )}

                  {/* 3. MESH GRADIENTS */}
                  {bgCategory === 'gradients' && (
                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 9 Dégradés Éclatants & Cyber :
                      </span>
                      <div className="grid grid-cols-3 gap-2">
                        {BG_GRADIENTS.map(grad => (
                          <button
                            key={grad.id}
                            onClick={() => applyBackground({ type: 'gradient', colors: grad.colors, value: grad.id })}
                            style={{ background: grad.css }}
                            className="h-14 rounded-xl border border-slate-700 hover:border-white transition-all hover:scale-105 flex items-end p-1.5 shadow-md"
                          >
                            <span className="text-[10px] font-bold text-white drop-shadow truncate">{grad.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 4. REALISTIC HD PHOTOS */}
                  {bgCategory === 'photos' && (
                    <div className="flex flex-col gap-2">
                      <span className="text-[11px] text-slate-400 font-bold">
                        👉 Décors Réalistes & Studio :
                      </span>
                      <div className="grid grid-cols-2 gap-2 max-h-72 overflow-y-auto pr-1">
                        {BG_PHOTOS.map(p => (
                          <button
                            key={p.id}
                            onClick={() => applyBackground({ type: 'image', url: p.url })}
                            className="relative h-20 rounded-xl overflow-hidden border border-slate-700 hover:border-indigo-500 hover:scale-105 transition-all text-left flex flex-col justify-end p-2 bg-slate-900"
                          >
                            <img src={p.url} alt={p.label} className="absolute inset-0 w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                            <span className="relative z-10 text-[10px] font-bold text-white truncate">{p.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Custom Background Upload */}
                  <div className="pt-2 border-t border-slate-800">
                    <label className="w-full py-2.5 px-3 rounded-xl border border-dashed border-slate-700 hover:border-indigo-500 bg-slate-950/40 flex items-center justify-center gap-2 text-xs font-semibold text-slate-300 cursor-pointer transition-all">
                      <Icon name="image" className="w-4 h-4 text-indigo-400" />
                      <span>Importer un fond depuis votre PC</span>
                      <input type="file" accept="image/*" className="hidden" onChange={handleCustomBg} />
                    </label>
                  </div>

                </div>
              )}

              {/* TAB 2: CROP */}
              {activeTab === 'crop' && (
                <div className="flex flex-col gap-4">
                  <span className="text-xs font-bold text-slate-300">Ratios Prédéfinis en 1 Clic</span>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { id: '1:1', label: '1:1 Carré' },
                      { id: '16:9', label: '16:9 YouTube' },
                      { id: '9:16', label: '9:16 Story' },
                    ].map(r => (
                      <button
                        key={r.id}
                        onClick={() => applyCrop(r.id)}
                        className="py-3 px-2 rounded-xl bg-slate-950 hover:bg-indigo-600 border border-slate-800 hover:border-indigo-500 text-xs font-bold transition-all text-center"
                      >
                        {r.label}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: RESIZE */}
              {activeTab === 'resize' && (
                <div className="flex flex-col gap-4">
                  <span className="text-xs font-bold text-slate-300">Préréglages Sociaux en 1 Clic</span>
                  <div className="grid grid-cols-2 gap-2">
                    {[
                      { label: 'Instagram Carré', w: 1080, h: 1080 },
                      { label: 'Story / TikTok', w: 1080, h: 1920 },
                      { label: 'YouTube Miniature', w: 1920, h: 1080 },
                      { label: 'E-Commerce HD', w: 1200, h: 1200 },
                    ].map(p => (
                      <button
                        key={p.label}
                        onClick={() => applyResize(p.w, p.h)}
                        className="p-3 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500 text-left transition-all"
                      >
                        <p className="text-xs font-bold text-slate-200">{p.label}</p>
                        <p className="text-[10px] font-mono text-indigo-400">{p.w} × {p.h} px</p>
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 4: WATERMARK */}
              {activeTab === 'watermark' && (
                <div className="flex flex-col gap-4">
                  <div className="flex items-center justify-between p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <span className="text-xs font-bold text-slate-200">Activer le Filigrane</span>
                    <input
                      type="checkbox"
                      checked={watermark.enabled}
                      onChange={(e) => setWatermark(prev => ({ ...prev, enabled: e.target.checked }))}
                      className="w-4 h-4 accent-indigo-600 cursor-pointer"
                    />
                  </div>

                  <div>
                    <span className="text-[11px] text-slate-400 block mb-1">Texte du Filigrane</span>
                    <input
                      type="text"
                      value={watermark.text}
                      onChange={(e) => setWatermark(prev => ({ ...prev, text: e.target.value }))}
                      className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white"
                    />
                  </div>
                </div>
              )}

            </aside>
          </div>

          {/* BEFORE / AFTER MODAL */}
          {comparingItem && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="relative w-full max-w-3xl bg-slate-900 rounded-3xl border border-slate-800 p-6 flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white">Comparaison Avant / Après</h3>
                  <button onClick={() => setComparingItem(null)} className="text-slate-400 hover:text-white">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="relative w-full h-[400px] bg-checkerboard flex items-center justify-center overflow-hidden rounded-2xl">
                  <img src={comparingItem.originalUrl} alt="Original" className="absolute inset-0 w-full h-full object-contain" />
                  <div style={{ clipPath: `inset(0 0 0 ${compareSlider}%)` }} className="absolute inset-0 w-full h-full">
                    <img src={comparingItem.currentUrl} alt="Modifié" className="w-full h-full object-contain" />
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="100"
                    value={compareSlider}
                    onChange={(e) => setCompareSlider(parseInt(e.target.value))}
                    className="absolute inset-0 opacity-0 cursor-ew-resize z-20 w-full h-full"
                  />
                  <div style={{ left: `${compareSlider}%` }} className="absolute top-0 bottom-0 w-1 bg-white pointer-events-none" />
                </div>
              </div>
            </div>
          )}

          {/* CERVEX MODAL */}
          {isCervexOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="relative w-full max-w-lg bg-slate-900 rounded-3xl border border-slate-800 p-6 flex flex-col gap-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <Icon name="cpu" className="w-5 h-5 text-cervex-400" />
                    <span>Hub de Connexion Cervex</span>
                  </h3>
                  <button onClick={() => setIsCervexOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="close" className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex flex-col gap-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Clé API Cervex</label>
                    <input type="password" value="crvx_live_9a87bf44d8e9" className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 font-mono" readOnly />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Projet ID</label>
                    <input type="text" value="project-ai-prod" className="w-full py-2 px-3 rounded-xl bg-slate-950 border border-slate-800 font-mono" readOnly />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                  <button
                    onClick={() => {
                      addToast('Cervex Sync', 'Synchronisation Cloud réussie (200 OK)', 'success');
                      setIsCervexOpen(false);
                    }}
                    className="px-4 py-2 rounded-xl bg-cervex-600 hover:bg-cervex-500 text-white font-bold text-xs"
                  >
                    Tester la synchronisation
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SPINNER */}
          {isProcessing && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col items-center gap-3">
                <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <p className="text-xs font-semibold text-slate-200">{processingMsg}</p>
              </div>
            </div>
          )}

          {/* TOASTS */}
          <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(toast => (
              <div key={toast.id} className="pointer-events-auto px-4 py-3 rounded-2xl bg-slate-900 border border-slate-700 shadow-2xl text-xs text-white">
                <span className="font-bold">{toast.title}</span> : <span className="text-slate-400">{toast.message}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
